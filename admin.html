<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>MARK 전주 사전예매 관리</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{color-scheme:dark;--bg:#0d0b08;--bg2:#15120d;--line:rgba(201,168,76,.18);--gold:#c9a84c;--gold2:#dfc06a;--t1:#f5f0e8;--t2:#a09888;--t3:#6b6156;--ok:#7fbf8a;--warn:#e0b24f;--no:#c97a6a}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
body{font-family:'Pretendard Variable',Pretendard,-apple-system,sans-serif;background:var(--bg);color:var(--t1);font-size:14px;line-height:1.5}
header{display:flex;justify-content:space-between;align-items:center;padding:16px 22px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(13,11,8,.95);z-index:5}
header h1{font-size:16px;font-weight:600;letter-spacing:.02em}
header h1 b{color:var(--gold);font-weight:700;letter-spacing:.2em;margin-right:8px}
.hbtn{background:none;border:1px solid var(--line);color:var(--t2);padding:7px 12px;border-radius:4px;cursor:pointer;font:inherit;font-size:13px}
.hbtn:hover{color:var(--t1);border-color:var(--gold)}
main{max-width:1280px;margin:0 auto;padding:22px}
.login{max-width:340px;margin:16vh auto;text-align:center}
.login h2{font-size:20px;margin-bottom:8px}
.login p{color:var(--t2);margin-bottom:20px}
.login input{width:100%;background:var(--bg2);border:1px solid var(--line);color:var(--t1);font-size:22px;letter-spacing:.4em;text-align:center;padding:14px;border-radius:4px;outline:none}
.login input:focus{border-color:var(--gold)}
.login button{width:100%;margin-top:12px;background:var(--gold);color:#16120a;border:0;padding:14px;border-radius:4px;font:inherit;font-weight:700;font-size:15px;cursor:pointer}
.login .err{color:var(--no);margin-top:10px;min-height:20px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}
.stat{background:var(--bg2);border:1px solid var(--line);border-radius:6px;padding:14px 16px}
.stat small{color:var(--t2);font-size:12px}
.stat b{display:block;font-size:22px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}
.stat b.g{color:var(--gold2)}
@media(max-width:820px){.stats{grid-template-columns:repeat(2,1fr)}}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.tools input{flex:1;min-width:200px;background:var(--bg2);border:1px solid var(--line);color:var(--t1);padding:10px 12px;border-radius:4px;font:inherit;outline:none}
.tabs{display:flex;gap:4px}
.tabs button{background:var(--bg2);border:1px solid var(--line);color:var(--t2);padding:9px 12px;border-radius:4px;cursor:pointer;font:inherit;font-size:13px}
.tabs button.on{background:var(--gold);color:#16120a;border-color:var(--gold);font-weight:700}
.wrap{background:var(--bg2);overflow-x:auto;border:1px solid var(--line);border-radius:6px}
table{width:100%;border-collapse:collapse;min-width:1050px}
th,td{padding:10px 10px;border-bottom:1px solid rgba(201,168,76,.09);text-align:left;vertical-align:middle;white-space:nowrap}
th{background:var(--bg2);color:var(--t2);font-weight:500;font-size:12px;cursor:pointer;user-select:none}
td.note{white-space:normal;min-width:160px;color:var(--t2);font-size:13px}
td.num{text-align:right;font-variant-numeric:tabular-nums}
.no{color:var(--gold2);font-variant-numeric:tabular-nums}
.disc{display:inline-block;margin-left:6px;font-size:11px;color:#16120a;background:var(--gold2);padding:1px 6px;border-radius:3px}
select.st{background:var(--bg);color:var(--t1);border:1px solid var(--line);padding:6px 8px;border-radius:4px;font:inherit}
select.st[data-v="입금확인"]{border-color:var(--ok);color:var(--ok)}
select.st[data-v="입금대기"]{border-color:var(--warn);color:var(--warn)}
select.st[data-v="취소"]{border-color:var(--no);color:var(--no)}
input.memo{background:transparent;border:1px solid transparent;color:var(--t2);padding:6px;border-radius:4px;font:inherit;width:150px}
input.memo:focus{border-color:var(--line);color:var(--t1);outline:none}
tr.flash td{background:rgba(201,168,76,.14);transition:background .2s}
.chk{color:var(--ok);margin-left:6px;font-weight:700}
.empty{padding:40px;text-align:center;color:var(--t3)}
.foot{margin-top:12px;color:var(--t3);font-size:12px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--gold);color:#16120a;padding:10px 16px;border-radius:4px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
</style>
</head>
<body>
<header><h1><b>MARK</b>전주 특별공연 사전예매 관리</h1><div><button class="hbtn" id="reload" hidden>새로고침</button> <button class="hbtn" id="csv" hidden>엑셀(CSV)</button> <button class="hbtn" id="logout" hidden>로그아웃</button></div></header>
<main>
  <section class="login" id="login">
    <h2>관리자 확인</h2>
    <p>관리자 PIN을 입력하세요.</p>
    <input id="pin" inputmode="numeric" maxlength="6" autocomplete="off" aria-label="관리자 PIN">
    <button id="go">확인</button>
    <p class="err" id="err"></p>
  </section>
  <section id="app" hidden>
    <div class="stats">
      <div class="stat"><small>신청 건수</small><b id="sCount">0</b></div>
      <div class="stat"><small>예매 매수 (취소 제외)</small><b id="sQty">0</b></div>
      <div class="stat"><small>입금확인 매수</small><b id="sOkQty" class="g">0</b></div>
      <div class="stat"><small>입금대기 건수</small><b id="sWait">0</b></div>
      <div class="stat"><small>예상 총 입금액</small><b id="sTotal">0원</b></div>
      <div class="stat"><small>입금확인 금액</small><b id="sOkAmt" class="g">0원</b></div>
      <div class="stat"><small>교회·단체 건수</small><b id="sGroup">0</b></div>
      <div class="stat"><small>취소 건수</small><b id="sCancel">0</b></div>
    </div>
    <div class="tools">
      <input id="q" placeholder="이름, 전화, 교회명, 예약번호 검색">
      <div class="tabs" id="tabs"><button class="on" data-f="">전체</button><button data-f="입금대기">입금대기</button><button data-f="입금확인">입금확인</button><button data-f="취소">취소</button></div>
    </div>
    <div class="wrap"><table>
      <thead><tr><th data-k="no">예약번호</th><th data-k="time">신청일시</th><th data-k="type">구분</th><th data-k="name">이름</th><th data-k="church">교회·단체</th><th data-k="phone">연락처</th><th data-k="qty">매수</th><th data-k="total">금액</th><th data-k="pickup">수령방법</th><th>요청사항</th><th data-k="status">입금상태</th><th>메모</th></tr></thead>
      <tbody id="tb"></tbody>
    </table><div class="empty" id="empty" hidden>표시할 예매가 없습니다.</div></div>
    <div class="foot"><span id="upd"></span><span>입금자명은 신청자 이름과 같게 받도록 안내하고 있습니다. 2026년 11월 12일 젠스파크 예매 28건을 복구했습니다. 입금상태는 원본 기준이며 실제 통장 내역과 대조해 주세요.</span></div>
  </section>
</main>
<div class="toast" id="toast"></div>
<script>
(function(){
  var API='https://script.google.com/macros/s/AKfycbwQbCfibWjqFoQ_BCyBEYfy-r7zgRoV4vfqkuoYvd2iehD0MZUJNsPqEkq8bm_3wd1n/exec';
  var $=function(s){return document.querySelector(s)};
  var rows=[], f='', sortK='time', sortDir=-1;
  var won=function(n){return (n||0).toLocaleString('ko-KR')+'원'};
  var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
  var tt; function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(function(){t.classList.remove('show')},2000)}
  function call(body){ body.pin=sessionStorage.getItem('mkpin')||''; return fetch(API,{method:'POST',body:JSON.stringify(body)}).then(function(r){return r.json()}); }
  function login(){
    var p=$('#pin').value.replace(/\D/g,''); if(p.length<4||p.length>6){$('#err').textContent='PIN을 확인하세요';return}
    sessionStorage.setItem('mkpin',p); $('#go').disabled=true; $('#err').textContent='';
    load().then(function(ok){ $('#go').disabled=false; if(!ok){sessionStorage.removeItem('mkpin')} });
  }
  function load(){
    return call({action:'admin_list'}).then(function(j){
      if(!j.ok){ $('#err').textContent = j.error==='locked' ? '여러 번 틀려 10분간 잠겼습니다' : 'PIN이 맞지 않습니다'; showApp(false); return false; }
      rows=j.rows||[]; showApp(true); render(); $('#upd').textContent='마지막 불러온 시각 '+new Date().toLocaleTimeString('ko-KR'); return true;
    }).catch(function(){ $('#err').textContent='불러오지 못했습니다. 잠시 후 다시 시도하세요'; return false; });
  }
  function showApp(on){ $('#login').hidden=on; $('#app').hidden=!on; ['#reload','#csv','#logout'].forEach(function(s){$(s).hidden=!on}); }
  function stats(){
    var live=rows.filter(function(r){return r.status!=='취소'});
    var ok=rows.filter(function(r){return r.status==='입금확인'});
    $('#sCount').textContent=rows.length;
    $('#sQty').textContent=live.reduce(function(a,r){return a+r.qty},0)+'매';
    $('#sOkQty').textContent=ok.reduce(function(a,r){return a+r.qty},0)+'매';
    $('#sWait').textContent=rows.filter(function(r){return r.status==='입금대기'}).length;
    $('#sTotal').textContent=won(live.reduce(function(a,r){return a+r.total},0));
    $('#sOkAmt').textContent=won(ok.reduce(function(a,r){return a+r.total},0));
    $('#sGroup').textContent=rows.filter(function(r){return r.type==='교회·단체'}).length;
    $('#sCancel').textContent=rows.filter(function(r){return r.status==='취소'}).length;
  }
  function render(){
    stats();
    var q=$('#q').value.trim().toLowerCase().replace(/-/g,'');
    var list=rows.filter(function(r){
      if(f && r.status!==f) return false;
      if(!q) return true;
      return [r.name,r.church,r.no,r.phone].join(' ').toLowerCase().replace(/-/g,'').indexOf(q)>=0;
    }).sort(function(a,b){var x=a[sortK],y=b[sortK];return (x>y?1:x<y?-1:0)*sortDir});
    $('#tb').innerHTML=list.map(function(r){
      return '<tr data-no="'+esc(r.no)+'"><td class="no">'+esc(r.no)+'</td><td>'+esc(r.time)+'</td><td>'+esc(r.type)+'</td><td>'+esc(r.name)+'</td><td>'+esc(r.church)+'</td><td><a href="tel:'+esc(r.phone)+'" style="color:inherit">'+esc(r.phone)+'</a></td><td class="num">'+r.qty+'</td><td class="num">'+won(r.total)+(r.disc?'<span class="disc">단체 10%</span>':'')+'</td><td>'+esc(r.pickup)+'</td><td class="note">'+esc(r.note)+'</td><td><select class="st" data-v="'+esc(r.status)+'"><option>입금대기</option><option>입금확인</option><option>취소</option></select></td><td><input class="memo" value="'+esc(r.memo)+'" placeholder="메모"></td></tr>';
    }).join('');
    Array.prototype.forEach.call(document.querySelectorAll('#tb tr'),function(tr){
      var r=rows.find(function(x){return x.no===tr.getAttribute('data-no')}); var sel=tr.querySelector('select'); sel.value=r.status;
      sel.addEventListener('change',function(){ var prev=r.status, v=sel.value; sel.disabled=true;
        call({action:'admin_update',no:r.no,status:v}).then(function(j){ if(!j.ok) throw 0; r.status=v; sel.setAttribute('data-v',v); tr.classList.add('flash'); var c=document.createElement('span'); c.className='chk'; c.textContent='✓'; sel.parentNode.appendChild(c); setTimeout(function(){tr.classList.remove('flash'); c.remove()},1800); stats(); })
          .catch(function(){ sel.value=prev; toast('저장하지 못했습니다. 다시 시도하세요'); }).finally(function(){ sel.disabled=false; }); });
      var memo=tr.querySelector('.memo');
      memo.addEventListener('change',function(){ call({action:'admin_update',no:r.no,memo:memo.value}).then(function(j){ if(!j.ok) throw 0; r.memo=memo.value; toast('메모를 저장했습니다'); }).catch(function(){ toast('메모를 저장하지 못했습니다'); }); });
    });
    $('#empty').hidden=list.length>0;
  }
  function csv(){
    var head=['예약번호','신청일시','구분','이름','교회·단체','연락처','매수','1매 금액','총 금액','단체할인','수령방법','요청사항','입금상태','메모'];
    var lines=[head].concat(rows.map(function(r){return [r.no,r.time,r.type,r.name,r.church,r.phone,r.qty,r.unit,r.total,r.disc,r.pickup,r.note,r.status,r.memo]}))
      .map(function(a){return a.map(function(v){v=String(v==null?'':v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}).join(',')});
    var blob=new Blob(['\ufeff'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'});
    var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='마크_전주_사전예매_'+new Date().toISOString().slice(0,10)+'.csv'; a.click();
  }
  $('#go').onclick=login; $('#pin').addEventListener('keydown',function(e){if(e.key==='Enter')login()});
  $('#q').addEventListener('input',render);
  Array.prototype.forEach.call(document.querySelectorAll('#tabs button'),function(b){b.onclick=function(){f=b.getAttribute('data-f');Array.prototype.forEach.call(document.querySelectorAll('#tabs button'),function(x){x.classList.toggle('on',x===b)});render()}});
  Array.prototype.forEach.call(document.querySelectorAll('th[data-k]'),function(th){th.onclick=function(){var k=th.getAttribute('data-k'); if(sortK===k) sortDir*=-1; else {sortK=k; sortDir=1} render()}});
  $('#reload').onclick=function(){load().then(function(){toast('새로 불러왔습니다')})};
  $('#csv').onclick=csv;
  $('#logout').onclick=function(){sessionStorage.removeItem('mkpin'); rows=[]; showApp(false); $('#pin').value=''};
  if(sessionStorage.getItem('mkpin')) load();
})();
</script>
</body>
</html>
